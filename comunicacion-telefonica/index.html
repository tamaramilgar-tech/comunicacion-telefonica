<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Unidad 3 · Comunicación telefónica (FP GS)</title>
  <link rel="stylesheet" href="css/styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
</head>
<body>
  <header class="header">
    <div class="container">
      <h1>Unidad 3 · Comunicación telefónica</h1>
      <p class="subtitle">FP Grado Superior · Administración y Finanzas · Comunicación y Atención al Cliente</p>
      <div class="topbar">
        <div class="student">
          <label for="studentName">Nombre del alumno/a</label>
          <input id="studentName" type="text" placeholder="Escribe tu nombre completo" />
        </div>
        <div class="status">
          <div class="badge" id="phase1Badge">FASE 1: pendiente</div>
          <div class="badge muted" id="phase2Badge">FASE 2: bloqueada</div>
        </div>
      </div>
    </div>
  </header>

  <main class="container main">
    <nav class="tabs">
      <button class="tab active" data-view="home">Inicio</button>
      <button class="tab" data-view="phase1">Fase 1</button>
      <button class="tab" data-view="phase2" id="phase2Tab" disabled>Fase 2</button>
      <button class="tab" data-view="certificate" id="certTab" disabled>Certificado</button>
    </nav>

    <section class="panel" id="view-home">
      <div class="card">
        <h2>Cómo funciona</h2>
        <p>Completa ambas fases con al menos un 80% para descargar el certificado.</p>
        <button class="primary" id="startPhase1Btn">Empezar Fase 1</button>
      </div>
    </section>

    <section class="panel hidden" id="view-phase1">
      <div class="card">
        <h2>FASE 1</h2>
        <div id="p1Quiz"></div>
        <button class="primary" id="p1SubmitQuiz">Corregir</button>
        <div id="p1QuizResult"></div>
      </div>
    </section>

    <section class="panel hidden" id="view-phase2">
      <div class="card">
        <h2>FASE 2</h2>
        <div id="p2Quiz"></div>
        <button class="primary" id="p2SubmitQuiz">Corregir</button>
        <div id="p2QuizResult"></div>
      </div>
    </section>

    <section class="panel hidden" id="view-certificate">
      <div class="card">
        <h2>Certificado</h2>
        <button class="primary" id="downloadCertBtn">Descargar PDF</button>
      </div>
    </section>
  </main>

  <script src="js/data.js"></script>
  <script src="js/certificate.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
